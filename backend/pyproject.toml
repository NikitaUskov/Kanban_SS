[project]
name = "kanban-board-backend"
version = "1.0.0"
description = "FastAPI backend for the Kanban Board MVP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "load: a long-running load scenario that requires a live server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

