name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate frontend
        run: |
          for file in frontend/assets/js/*.js; do
            node --check "$file"
          done
          npm --prefix frontend test
          node --input-type=module -e \
            "import fs from 'node:fs'; import {validateRuntimeConfig} from './frontend/assets/js/config.js'; validateRuntimeConfig(JSON.parse(fs.readFileSync('./frontend/runtime-config.json', 'utf8')));"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          mkdir -p pages-artifact
          cp frontend/index.html frontend/404.html frontend/.nojekyll \
            frontend/runtime-config.json pages-artifact/
          cp -R frontend/assets pages-artifact/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
